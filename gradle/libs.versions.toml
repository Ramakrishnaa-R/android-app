[versions]
agp = "9.2.0"
kotlin = "2.2.10"
coreKtx = "1.12.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.7.0"
activityCompose = "1.8.2"
composeBom = "2024.09.00"
camerax = "1.3.1"
appcompat = "1.6.1"
constraintlayout = "2.1.4"
cardview = "1.0.0"
recyclerview = "1.3.2"
mlkitText = "16.0.0"
mlkitObject = "17.0.2"
okhttp = "4.12.0"
tensorflowLite = "2.14.0"
tensorflowLiteSupport = "0.4.4"
mediapipe = "0.10.35"



[libraries]

mediapipe-tasks-vision = { group = "com.google.mediapipe", name = "tasks-vision", version.ref = "mediapipe" }
mediapipe-tasks-genai = { group = "com.google.mediapipe", name = "tasks-genai", version.ref = "mediapipe" }
mediapipe-tasks-text = { group = "com.google.mediapipe", name = "tasks-text", version.ref = "mediapipe" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
